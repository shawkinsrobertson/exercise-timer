<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <title>Exercise Timer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                margin: 0;
                padding: 0;
        }

        #timer-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

       .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 1;
        }

        .tab-button {
            padding: 12px;
            background-color: #e0e0e0;
            border: 0.5px solid #5b5b5c;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            color:#5b5b5c;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background-color: #2489f6;
            color: #fff;
            font-weight: bold;
            border: 2px solid #0156b0;
        }

        .tab-button:hover {
            background-color: #d0d0d0;
        }

        .tab-button.active:hover {
            background-color: #0b60bb;
        }

        #timer, #timer2 {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background-color: #f1efef;
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 2;
            border: 1px solid #bbbcbd;
            min-height: 300px;
        }

        #timer.active, #timer2.active {
            opacity: 1;
            display: flex;
            z-index: 5;
        }

        h1 {
            margin: 0;
            font-size: 1.1em;
        }

        #timerDisplay, #timerDisplay2 {
            font-size: 5em;
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            text-align: center;
            margin-bottom: 20px;
        }

        .quick-select {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            justify-content: center;
        }

        .select-label {
            margin-bottom: -5px;
            font-size: 0.9em;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        #thirtySecondBtn, #oneMinuteBtn, #ninetySecondBtn, 
        #thirtyThirtyBtn, #fortyTwentyBtn, #thirtyFifteenBtn, 
        #fortyFiveFifteenBtn {
            padding: 10px 16px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .startBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .stopBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #ff4800;
            color: white;
            cursor: pointer;
        }

        .resetBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #timerDisplay2.work-phase {
            background-color: #ff6b6b;
            color: white;
        }

        #timerDisplay2.rest-phase {
            background-color: #51cf66;
            color: white;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
           

            .tab-button {
                z-index: 2;
            }

            .tab-button.active {
                z-index: 6;
            }

            #timer, #timer2 {
                position: relative;
                z-index: 5 !important;
            }

            .quick-select {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>   
    <div id="timer-container">
        <div class="tabs">
                <button class="tab-button active" data-tab="timer">Rest Timer</button>
                <button class="tab-button" data-tab="timer2">Circuit Timer</button>
            </div>
            <!-- Rest Timer Tab -->
        <div id="timer" class="active">
            <div id="timerDisplay">0:00</div>
            <div class="quick-select">
                <div class="select-label">
                    <p>Quick Select</p>
                </div>
                <div class="select-buttons">
                    <button id="thirtySecondBtn">0:30</button>
                    <button id="oneMinuteBtn">1:00</button>
                    <button id="ninetySecondBtn">1:30</button>
                </div>
            </div>
            <div class="controls">
                <button class="startBtn">Start</button>
                <button class="stopBtn">Stop</button>
                <button class="resetBtn">Reset</button>
            </div>
        </div>

            <!-- Circuit Timer Tab -->
        <div id="timer2">
            <div id="timerDisplay2">0:00</div>
            <div class="quick-select">
                <div class="select-label">
                    <p>Quick Select</p>
                </div>
                <div class="select-buttons">
                    <button id="thirtyThirtyBtn">30:30</button>
                    <button id="fortyTwentyBtn">40:20</button>
                    <button id="thirtyFifteenBtn">30:15</button>
                    <button id="fortyFiveFifteenBtn">45:15</button>
                </div>
            </div>
            <div class="controls">
                <button class="startBtn">Start</button>
                <button class="stopBtn">Stop</button>
                <button class="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
       /* document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                
                // Remove active class from all buttons and tabs
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('#timer, #timer2').forEach(tab => tab.classList.remove('active'));
                
                // Add active class to clicked button and corresponding tab
                this.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        }); */

                // ===== TAB SWITCHING  ATTEMPT 2=====
        // Get all tab buttons and tab sections
        const allTabButtons = document.querySelectorAll('.tab-button');
        const allTabs = document.querySelectorAll('#timer, #timer2');

        allTabButtons.forEach(button => {
            button.addEventListener('click', function() {
                const targetTab = this.getAttribute('data-tab');
                
                // Remove active class from all buttons and tabs
                allTabButtons.forEach(btn => btn.classList.remove('active'));
                allTabs.forEach(tab => tab.classList.remove('active'));
                
                // Add active class only to clicked button and its corresponding tab
                this.classList.add('active');
                document.getElementById(targetTab).classList.add('active');
                
                // Stop any running timers when switching tabs
                clearInterval(restIntervalId);
                clearInterval(circuitIntervalId);
                clearInterval(circuitCountdownId);
                restIntervalId = null;
                circuitIntervalId = null;
                circuitCountdownId = null;
            });
        });

        // Initialize audio elements
        const countdownBeepSound = new Audio('../sounds/countdown-sound.mp3');
        const timerStartSound = new Audio('../sounds/rest-timer-begin.mp3');
        const workStartSound = new Audio('../sounds/work-interval-sound.mp3');
        const restStartSound = new Audio('../sounds/rest-interval-sound.mp3');
        const restEndSound = new Audio('../sounds/rest-timer-end.mp3');

        [countdownBeepSound, timerStartSound, workStartSound, restStartSound, restEndSound].forEach(sound => {
            sound.preload = 'auto';
        });

        let circuitCountdownId = null;

        function playSound(audio) {
            if (!audio) return;
            try {
                audio.currentTime = 0;
                audio.play();
            } catch (error) {
                // Ignore audio playback errors if the browser blocks autoplay policies
            }
        }

        function stopCircuitCountdown() {
            if (circuitCountdownId) {
                clearInterval(circuitCountdownId);
                circuitCountdownId = null;
            }
        }

        function startCircuitCountdown() {
            stopCircuitCountdown();
            let remainingBeepCount = 3;

            playSound(countdownBeepSound);
            remainingBeepCount--;

            circuitCountdownId = setInterval(() => {
                if (remainingBeepCount > 0) {
                    playSound(countdownBeepSound);
                    remainingBeepCount--;
                } else {
                    stopCircuitCountdown();
                    playSound(timerStartSound);
                    startCircuitPhase();
                }
            }, 1000);
        }

        // ===== REST TIMER (Timer 1) =====
        let restTimerSeconds = 0;
        let restIntervalId = null;
        let restTimerMode = null; // 'count-down' or 'count-up'
        const restDisplay = document.querySelector('#timer #timerDisplay');
        const restStartBtn = document.querySelector('#timer .startBtn');
        const restStopBtn = document.querySelector('#timer .stopBtn');
        const restResetBtn = document.querySelector('#timer .resetBtn');

        function updateRestDisplay() {
            const minutes = Math.floor(restTimerSeconds / 60);
            const seconds = restTimerSeconds % 60;
            restDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Rest timer preset buttons
        document.getElementById('thirtySecondBtn').addEventListener('click', () => {
            if (restIntervalId) clearInterval(restIntervalId);
            restIntervalId = null;
            restTimerSeconds = 30;
            restTimerMode = 'count-down';
            updateRestDisplay();
        });

        document.getElementById('oneMinuteBtn').addEventListener('click', () => {
            if (restIntervalId) clearInterval(restIntervalId);
            restIntervalId = null;
            restTimerSeconds = 60;
            restTimerMode = 'count-down';
            updateRestDisplay();
        });

        document.getElementById('ninetySecondBtn').addEventListener('click', () => {
            if (restIntervalId) clearInterval(restIntervalId);
            restIntervalId = null;
            restTimerSeconds = 90;
            restTimerMode = 'count-down';
            updateRestDisplay();
        });

        restStartBtn.addEventListener('click', () => {
            if (restIntervalId) clearInterval(restIntervalId);
            
            // If no preset selected, count up
            if (restTimerMode === null) {
                restTimerMode = 'count-up';
            }

            if (restTimerMode === 'count-down') {
                restIntervalId = setInterval(() => {
                    if (restTimerSeconds > 0) {
                        restTimerSeconds--;
                        updateRestDisplay();
                    } else {
                        clearInterval(restIntervalId);
                        restIntervalId = null;
                        restTimerMode = null;
                    }
                }, 1000);
            } else if (restTimerMode === 'count-up') {
                restIntervalId = setInterval(() => {
                    restTimerSeconds++;
                    updateRestDisplay();
                }, 1000);
            }
        });

        restStopBtn.addEventListener('click', () => {
            if (restIntervalId) {
                clearInterval(restIntervalId);
                restIntervalId = null;
            }
        });

        restResetBtn.addEventListener('click', () => {
            if (restIntervalId) {
                clearInterval(restIntervalId);
                restIntervalId = null;
            }
            restTimerSeconds = 0;
            restTimerMode = null;
            updateRestDisplay();
        });

        // ===== CIRCUIT TIMER (Timer 2) =====
        let circuitIntervalId = null;
        let circuitSeconds = 0;
        let circuitPhase = null; // 'work' or 'rest'
        let circuitWorkTime = 0;
        let circuitRestTime = 0;
        const circuitDisplay = document.querySelector('#timer2 #timerDisplay2');
        const circuitStartBtn = document.querySelector('#timer2 .startBtn');
        const circuitStopBtn = document.querySelector('#timer2 .stopBtn');
        const circuitResetBtn = document.querySelector('#timer2 .resetBtn');

        function updateCircuitDisplay() {
            const minutes = Math.floor(circuitSeconds / 60);
            const seconds = circuitSeconds % 60;
            const phaseLabel = circuitPhase === 'work' ? 'Work' : 'Rest';
            circuitDisplay.textContent = `${phaseLabel} ${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Update colors based on phase
            circuitDisplay.classList.remove('work-phase', 'rest-phase');
            if (circuitPhase === 'work') {
                circuitDisplay.classList.add('work-phase');
            } else if (circuitPhase === 'rest') {
                circuitDisplay.classList.add('rest-phase');
            }
        }

        function startCircuitPhase() {
            if (circuitPhase === 'work') {
                circuitSeconds = circuitWorkTime;
                playSound(workStartSound);
            } else if (circuitPhase === 'rest') {
                circuitSeconds = circuitRestTime;
                playSound(restStartSound);
            }
            updateCircuitDisplay();

            circuitIntervalId = setInterval(() => {
                if (circuitSeconds > 0) {
                    circuitSeconds--;
                    updateCircuitDisplay();
                } else {
                    clearInterval(circuitIntervalId);
                    circuitIntervalId = null;

                    if (circuitPhase === 'work') {
                        circuitPhase = 'rest';
                        startCircuitPhase();
                    } else {
                        playSound(restEndSound);
                        circuitPhase = 'work';
                        setTimeout(startCircuitPhase, 300);
                    }
                }
            }, 1000);
        }

        // Circuit timer preset buttons
        document.getElementById('thirtyThirtyBtn').addEventListener('click', () => {
            if (circuitIntervalId) clearInterval(circuitIntervalId);
            circuitIntervalId = null;
            circuitWorkTime = 30;
            circuitRestTime = 30;
            circuitPhase = 'work';
            circuitSeconds = circuitWorkTime;
            updateCircuitDisplay();
        });

        document.getElementById('fortyTwentyBtn').addEventListener('click', () => {
            if (circuitIntervalId) clearInterval(circuitIntervalId);
            circuitIntervalId = null;
            circuitWorkTime = 40;
            circuitRestTime = 20;
            circuitPhase = 'work';
            circuitSeconds = circuitWorkTime;
            updateCircuitDisplay();
        });

        document.getElementById('thirtyFifteenBtn').addEventListener('click', () => {
            if (circuitIntervalId) clearInterval(circuitIntervalId);
            circuitIntervalId = null;
            circuitWorkTime = 30;
            circuitRestTime = 15;
            circuitPhase = 'work';
            circuitSeconds = circuitWorkTime;
            updateCircuitDisplay();
        });

        document.getElementById('fortyFiveFifteenBtn').addEventListener('click', () => {
            if (circuitIntervalId) clearInterval(circuitIntervalId);
            circuitIntervalId = null;
            circuitWorkTime = 45;
            circuitRestTime = 15;
            circuitPhase = 'work';
            circuitSeconds = circuitWorkTime;
            updateCircuitDisplay();
        });

        circuitStartBtn.addEventListener('click', () => {
            if (circuitPhase && !circuitIntervalId && !circuitCountdownId) {
                startCircuitCountdown();
            }
        });

        circuitStopBtn.addEventListener('click', () => {
            if (circuitIntervalId) {
                clearInterval(circuitIntervalId);
                circuitIntervalId = null;
            }
            stopCircuitCountdown();
        });

        circuitResetBtn.addEventListener('click', () => {
            if (circuitIntervalId) {
                clearInterval(circuitIntervalId);
                circuitIntervalId = null;
            }
            stopCircuitCountdown();
            circuitSeconds = 0;
            circuitPhase = null;
            circuitDisplay.textContent = '0:00';
        });
    </script>
</body>
</html>
